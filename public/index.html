<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rasoi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Rasoi: Apple-style Liquid Glass. One bold element: today's dish on a glass plate over a saffron glow. */
:root{
  --canvas:#F2F2F7; --ink:#1C1C1E; --ink2:#3C3C43; --muted:#8E8E93; --hair:rgba(60,60,67,.14);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --rim:rgba(255,255,255,.75);
  --saffron:#FF9F0A; --saffron-ink:#C26A00; --leaf:#34C759; --leaf-ink:#1F8A3B; --chilli:#FF3B30; --sky:#0A84FF;
  --glow1:rgba(255,159,10,.55); --glow2:rgba(255,94,58,.24); --glow3:rgba(52,199,89,.18);
  --shadow:0 1px 1px rgba(0,0,0,.04),0 8px 30px rgba(31,24,10,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --canvas:#000000; --ink:#F5F5F7; --ink2:#D1D1D6; --muted:#98989F; --hair:rgba(84,84,88,.45);
  --glass:rgba(38,38,42,.55); --glass-strong:rgba(44,44,48,.82); --rim:rgba(255,255,255,.10);
  --saffron:#FFA826; --saffron-ink:#FFB340; --leaf:#30D158; --leaf-ink:#30D158; --chilli:#FF453A; --sky:#0A84FF;
  --glow1:rgba(255,159,10,.30); --glow2:rgba(255,69,58,.14); --glow3:rgba(48,209,88,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}}
body.decided{--glow1:rgba(52,199,89,.34);--glow3:rgba(255,159,10,.22)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);
  font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Kohinoor Devanagari","Noto Sans Devanagari","Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;transition:background .8s ease;
  background:radial-gradient(38vmax 30vmax at 18% 8%,var(--glow1),transparent 70%),
             radial-gradient(34vmax 28vmax at 92% 22%,var(--glow2),transparent 70%),
             radial-gradient(40vmax 32vmax at 60% 96%,var(--glow3),transparent 70%)}
.wrap{max-width:660px;margin:0 auto;padding:12px 18px 0}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:10px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.thali{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--saffron),#FF6A3D,var(--saffron));box-shadow:inset 0 0 0 6px var(--glass-strong),0 2px 8px var(--glow1)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}

/* glass material */
.glass,.person,.opt,.msg.bot,.banner,.plate,nav#nav,.toast,table.list{
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--rim);box-shadow:var(--shadow)}

/* large titles */
.hero{margin:18px 0 6px}
.hero p{margin:0;color:var(--muted);font-size:15px;font-weight:500}
.hero h1{margin:2px 0 0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:30px 0 10px}

/* the plate: today's dish */
.plate{border-radius:30px;padding:22px 22px 20px;margin-top:16px;position:relative;overflow:hidden;isolation:isolate}
.plate::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--glow1),transparent 70%);pointer-events:none;z-index:-1}
.dish{font-size:clamp(32px,8.6vw,48px);font-weight:800;line-height:1.04;letter-spacing:-.035em;margin:6px 0 10px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Kohinoor Devanagari","Noto Sans Devanagari",sans-serif}
.meta{color:var(--muted);margin:0;font-size:15px}
.pill-tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,159,10,.16);color:var(--saffron-ink)}
.pill-tag.ok{background:rgba(52,199,89,.16);color:var(--leaf-ink)}

/* options */
.opt{border-radius:22px;padding:16px 18px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.opt b{font-size:17px;font-weight:600;letter-spacing:-.015em}
.opt > span:nth-child(2){font-size:15px;font-weight:600;color:var(--saffron-ink);white-space:nowrap}
.bar{grid-column:1/-1;height:6px;background:var(--hair);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--saffron),#FF6A3D);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;grid-column:1/-1}
.choice button[aria-pressed=true]{background:var(--saffron);border-color:transparent;color:#1C1C1E}

/* buttons: Apple pills */
button{font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;border-radius:999px;padding:10px 18px;cursor:pointer;
  border:1px solid var(--rim);background:var(--glass-strong);color:var(--ink);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .12s ease,background .2s ease}
button:active{transform:scale(.97)}
button.primary{background:var(--ink);color:var(--canvas);border-color:transparent}
@media (prefers-color-scheme:dark){button.primary{background:var(--saffron);color:#1C1C1E}}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.who{font-size:14px;padding:7px 13px}

/* forms: inset grouped */
label{display:block;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;width:100%;margin-top:4px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--hair);background:var(--glass-strong);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=file]{padding:9px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 4px rgba(255,159,10,.2)}
.person{border-radius:24px;padding:18px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.plan{border-top:1px solid var(--hair);margin-top:18px;padding-top:14px}

/* lists and tables */
.scroll{overflow-x:auto;border-radius:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
.scroll table{background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--rim);border-radius:20px;overflow:hidden}
td,th{text-align:left;padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--muted);font-weight:500}
td input{max-width:96px;padding:7px 10px;margin:0}
.todo{list-style:none;padding:0;margin:8px 0;border-radius:20px;overflow:hidden;background:var(--glass);border:1px solid var(--rim);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.todo li{padding:12px 16px;border-bottom:1px solid var(--hair)}
.todo li:last-child{border-bottom:0}
details{margin-top:10px;border-radius:18px;background:var(--glass);border:1px solid var(--rim);padding:12px 16px}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted);font-weight:400}
details[open] summary::after{content:"\2212"}
details ol{padding-left:20px;margin:10px 0 4px}
details li{margin:6px 0}

/* status */
.banner{border-radius:20px;padding:14px 16px;margin-top:16px;font-size:15px}
.done{color:var(--leaf-ink);font-weight:600}
.err{color:var(--chilli)}
.warn{background:var(--chilli);color:#fff;border-radius:16px;padding:12px 16px;margin:12px 0;font-weight:600}
.meter{height:10px;background:var(--hair);border-radius:5px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--leaf),#5EE07A)}
.meter i.over{background:linear-gradient(90deg,var(--chilli),#FF7A6E)}

/* chat: message bubbles */
.msg{border-radius:22px;padding:11px 15px;margin:8px 0;max-width:86%;overflow-wrap:anywhere;font-size:16px}
.msg.me{background:linear-gradient(180deg,#FFB03A,var(--saffron));color:#1C1C1E;margin-left:auto;width:fit-content;border-bottom-right-radius:7px}
.msg.bot{border-bottom-left-radius:7px}
.msg a{color:var(--sky)}
.yt{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:600;text-decoration:none;color:var(--chilli)!important}
.yt svg{width:20px;height:20px}

/* floating tab bar */
nav#nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100vw - 24px);background:var(--glass-strong);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%)}
nav#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;padding:7px 10px 6px;border:0;background:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0}
nav#nav button svg{width:23px;height:23px}
nav#nav button[aria-current=page]{background:var(--glass-strong);color:var(--saffron-ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* toast: island at the top */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;
  border-radius:999px;padding:11px 18px;font-size:15px;font-weight:600;max-width:92vw;text-align:center}
.toast.err{color:var(--chilli)}

@media (prefers-reduced-motion:no-preference){
  .plate{animation:settle .6s cubic-bezier(.2,.8,.2,1)}
  @keyframes settle{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .toast{animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.9)}}
}
@media (max-width:420px){nav#nav button{min-width:54px;padding:7px 6px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="thali" aria-hidden="true"></span>Rasoi</div>
    <div class="top-actions" id="top"></div>
  </div>
  <main id="main"><p class="meta" style="margin-top:40px">Loading...</p></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<script>
const TABS = [['today', 'Today'], ['ask', 'Ask'], ['family', 'Family'], ['pantry', 'Pantry'], ['spend', 'Spend'], ['setup', 'Setup']];
const FIELDS = [
  ['name', 'Name'], ['role', 'Role', ['family', 'cook']],
  ['diet', 'Diet', ['', 'veg', 'non-veg', 'eggetarian', 'vegan', 'jain']], ['no_meat_days', 'No-meat days', 'e.g. Tuesday, Navratri'],
  ['allergies', 'Allergies', 'concrete items, e.g. peanut, prawn. Or "none"'], ['dislikes', 'Dislikes'], ['favourites', 'Favourite dishes'],
  ['spice', 'Spice level', ['', 'low', 'medium', 'high']], ['lunch', 'Next-day lunch', ['', 'home', 'tiffin', 'varies']], ['notes', 'Anything else', 'e.g. low oil'],
];
// Storage can throw in some private or standalone modes; never let that blank the page.
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};
let key = store.get('rasoi-key'), me = store.get('rasoi-me'), data = null, preview = null;
let chat = (() => { try { return JSON.parse(store.get('rasoi-chat')) || []; } catch { return []; } })();
const saveChat = () => store.set('rasoi-chat', JSON.stringify(chat.slice(-40)));
function showFatal(m) {
  const el = document.getElementById('main');
  if (el) el.insertAdjacentHTML('afterbegin', `<p class="err">Something went wrong: ${esc(m)} <button onclick="location.reload()">Reload</button></p>`);
}
addEventListener('error', e => showFatal(e.message));
addEventListener('unhandledrejection', e => showFatal(e.reason?.message || String(e.reason)));
let tab = location.hash.slice(1) || 'today';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = (s, d) => { if (!s) return d; try { return JSON.parse(s); } catch { return d; } };
const meRow = () => data.members?.find(m => m.name === me);
const isIOS = /iPhone|iPad/.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

navigator.serviceWorker?.register('/sw.js');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.append(t); setTimeout(() => t.remove(), 4000);
}

async function api(method, body) {
  if (!key) throw Object.assign(new Error(''), { login: true });
  const r = await fetch('/api/app', { method, headers: { 'x-app-key': key || '', 'content-type': 'application/json' }, body: body && JSON.stringify({ ...body, me }) });
  const j = await r.json().catch(() => ({ error: 'The server sent an unreadable reply. Try again.' }));
  if (r.status === 401) { store.del('rasoi-key'); key = null; throw Object.assign(new Error('Wrong password, try again'), { login: true }); }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed'), { missing: j.missing });
  return j;
}

async function refresh() {
  try { data = await api('GET'); } catch (e) { data = { error: e.message, login: e.login }; }
  render();
}

async function act(body, done) {
  try { const r = await api('POST', body); await refresh(); if (done) toast(done); return r; }
  catch (e) { render(); toast(e.message + (e.missing ? ` (${e.missing.length} items left)` : ''), true); }
}

function busy(btn, text) { if (btn) { btn.disabled = true; btn.textContent = text; } }

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>'),
  ask: svg('<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.1A8 8 0 1 1 20 12z"/>'),
  family: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14c2.3.2 4 1.7 4.5 4.5"/>'),
  pantry: svg('<rect x="5" y="7" width="14" height="13" rx="3"/><path d="M7 4h10v3H7z"/><path d="M9 12h6"/>'),
  spend: svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/>'),
  setup: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9.2v5.6l4.8-2.8z" fill="#fff"/></svg>',
};
const TITLE = { today: 'Tonight’s dinner', ask: 'Ask Rasoi', family: 'Family', pantry: 'Pantry', spend: 'Spending', setup: 'Setup' };
const longDate = () => new Date((data?.today || new Date().toISOString().slice(0, 10)) + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const hero = (title, sub = longDate()) => `<header class="hero"><p>${esc(sub)}</p><h1>${esc(title)}</h1></header>`;

function render() {
  $('#nav').innerHTML = TABS.filter(([k]) => k !== 'setup').map(([k, l]) =>
    `<button data-tab="${k}" ${k === tab ? 'aria-current="page"' : ''}>${ICON[k]}<span>${l}</span></button>`).join('');
  $('#top').innerHTML = (me ? `<button class="who" onclick="me=null;store.del('rasoi-me');render()" title="Change person">${esc(me)}</button>` : '')
    + `<button class="icon-btn" data-tab="setup" aria-label="Setup" ${tab === 'setup' ? 'aria-current="page"' : ''}>${ICON.setup}</button>`;
  const d = data?.days?.find(x => x.date === data.today);
  document.body.classList.toggle('decided', ['decided', 'cooked'].includes(d?.status));
  if (data.login) return $('#main').innerHTML = hero('Welcome', 'Rasoi') + viewLogin(data.error);
  if (data.error && !data.needsInit) return $('#main').innerHTML = hero('Something went wrong', 'Rasoi') + `<p class="banner err">${esc(data.error)}</p><p><button onclick="refresh()">Try again</button></p>`;
  if (data.needsInit) tab = 'setup';
  else if (me && !meRow()) { me = null; store.del('rasoi-me'); }
  if (!data.needsInit && !me && data.members.length && !['family', 'setup'].includes(tab)) return $('#main').innerHTML = hero('Who’s using this phone?') + viewWho();
  $('#main').innerHTML = hero(TITLE[tab]) + pushBanner() + { today: viewToday, ask: viewAsk, family: viewFamily, pantry: viewPantry, spend: viewSpend, setup: viewSetup }[tab]();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; location.hash = tab; render(); }
});

// ---------- login ----------
function viewLogin(msg) {
  return `${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <form class="row person" onsubmit="login(event)"><label>Password<input name="pw" type="password" required autocomplete="current-password"></label>
    <button class="primary">Open Rasoi</button></form>`;
}
function login(e) { e.preventDefault(); key = new FormData(e.target).get('pw'); store.set('rasoi-key', key); refresh(); }

// ---------- Ask (AI chat) ----------
const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^\s*[-*]\s+/gm, '&bull; ').replace(/\n/g, '<br>');
function viewAsk() {
  const msgs = chat.map((m, i) => m.role === 'user' ? `<div class="msg me">${esc(m.text)}</div>`
    : `<div class="msg bot">${fmt(m.text)}
        ${m.youtube ? `<br><a class="yt" href="${esc(m.youtube)}" target="_blank" rel="noopener">${ICON.play}Watch videos on YouTube</a>` : ''}
        ${m.sources?.length ? `<p class="meta" style="margin-top:8px">Sources: ${m.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(', ')}</p>` : ''}
        <p class="row" style="margin-top:8px"><button class="who" onclick="shareMsg(this, ${i})">Share</button></p></div>`).join('');
  return `<p class="meta">Recipes, nutrition, swaps, what to make with what is at home. Answers follow everyone's allergies and diet plans.</p>
    <div id="chat">${msgs || '<p class="meta" style="margin-top:14px">Try: "High-protein veg breakfast ideas" or "How do I make dal makhani in the pressure cooker?"</p>'}</div>
    <form class="row" onsubmit="ask(event)" style="margin-top:14px"><label style="flex:1;min-width:220px">Your question<input name="q" required autocomplete="off" ${me ? '' : 'disabled placeholder="Choose who you are first"'}></label>
    <button class="primary" ${me ? '' : 'disabled'}>Ask</button></form>
    ${chat.length ? `<p style="margin-top:12px"><button onclick="if(confirm('Clear this chat on this phone?')){chat=[];saveChat();render()}">Clear chat</button></p>` : ''}`;
}
async function ask(e) {
  e.preventDefault();
  const q = new FormData(e.target).get('q').trim();
  if (!q) return;
  chat.push({ role: 'user', text: q }); saveChat(); render();
  $('#chat').insertAdjacentHTML('beforeend', '<p class="meta" id="thinking">Thinking...</p>');
  scrollTo(0, document.body.scrollHeight);
  try {
    const r = await api('POST', { action: 'chat', messages: chat.map(({ role, text }) => ({ role, text })) });
    chat.push({ role: 'model', text: r.text, sources: r.sources, youtube: r.youtube }); saveChat();
  } catch (err) { toast(err.message, true); }
  render(); scrollTo(0, document.body.scrollHeight);
}
async function shareMsg(btn, i) {
  const m = chat[i], text = m.text + (m.youtube ? '\n\nVideos: ' + m.youtube : '');
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  await navigator.clipboard.writeText(text); btn.textContent = 'Copied';
}

// ---------- who is using this phone ----------
function viewWho() {
  return `<p class="meta">Votes and notifications go to this person.</p>
    <div class="choice">${data.members.map(m => `<button onclick="pick('${esc(m.name)}')">${esc(m.name)}${m.role === 'cook' ? ' (cook)' : ''}</button>`).join('')}</div>`;
}
function pick(name) { me = name; store.set('rasoi-me', name); render(); }

// ---------- notifications ----------
function pushBanner() {
  if (!me || data.needsInit || data.subs.some(s => s.member === me)) return '';
  if (isIOS && !standalone) return `<p class="banner">To get notifications on iPhone: tap Share, then Add to Home Screen, and open Rasoi from the home screen.</p>`;
  return `<p class="banner row">Turn on notifications on this phone to get the daily vote.<button class="primary" onclick="enablePush(this)">Turn on notifications</button></p>`;
}
const urlB64 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function enablePush(btn) {
  if (!('PushManager' in window)) return toast('This browser cannot receive notifications. Use Chrome on Android, or the home screen app on iPhone.', true);
  if (!data.vapidPublicKey) return toast('VAPID_PUBLIC_KEY is missing in Netlify settings.', true);
  busy(btn, 'Turning on...');
  if (await Notification.requestPermission() !== 'granted') { render(); return toast('Notifications are blocked. Allow them for Rasoi in the phone settings.', true); }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(data.vapidPublicKey) });
  if (await act({ action: 'subscribe', subscription: sub.toJSON() })) act({ action: 'testPush' }, 'Notifications are on. A test is on its way.');
}

// ---------- Today ----------
function viewToday() {
  const cook = meRow()?.role === 'cook';
  const d = data.days.find(x => x.date === data.today);
  let h = data.settings.LIVE === 'TRUE' ? '' : `<p class="banner">The agent is not live yet, so no notifications go out. Finish the checklist in <button data-tab="setup">Setup</button></p>`;
  if (!d) h += `<section class="plate"><span class="pill-tag">Vote opens at 12:00</span><div class="dish">Nothing decided yet</div><p class="meta">Three combos arrive at noon. Voting closes at 1pm.</p></section>`;
  else if (d.status === 'voting') {
    const opts = J(d.options, []), latest = {};
    data.votes.filter(v => v.date === d.date).forEach(v => latest[v.member] = +v.option);
    const tally = opts.map((_, i) => Object.values(latest).filter(n => n === i + 1).length);
    const lead = opts[tally.indexOf(Math.max(...tally))];
    const votes = Object.keys(latest).length;
    h += `<section class="plate"><span class="pill-tag">Voting until 1pm${d.mode === 'off' ? ', cook is off' : ''}</span><div class="dish">${esc(lead?.name)}</div>
      <p class="meta">${votes ? `Leading with ${votes} of ${data.family.length} votes in` : 'No votes yet. Pick the one you want below.'}</p></section><h2>Options</h2>`;
    h += opts.map((o, i) => `<div class="opt"><b>${i + 1}. ${esc(o.name)}</b><span>${tally[i]} vote${tally[i] === 1 ? '' : 's'}</span>
      <span class="meta">${esc(o.summary)} About ${esc(o.cook_minutes)} min, AED ${esc(o.est_cost_aed)}, ${esc(o.missing_items)} to buy.</span>
      <span class="bar"><i style="width:${data.family.length ? tally[i] / data.family.length * 100 : 0}%"></i></span>
      ${cook ? '' : `<span class="choice"><button aria-pressed="${latest[me] === i + 1}" onclick="this.disabled=true;act({action:'vote',n:${i + 1}},'Vote saved')">${latest[me] === i + 1 ? 'Your vote' : 'Vote for this'}</button></span>`}</div>`).join('');
  } else {
    const w = J(d.winner, {}), r = J(d.recipe, null), miss = J(d.missing, []);
    const label = { decided: 'Decided, cooking tonight', cooked: 'Cooked', postponed: 'Moved to tomorrow, cook is off', off: 'Cook is off today', skip: 'No cooking today, eating out' }[d.status] || d.status;
    h += `<section class="plate"><span class="pill-tag ${['decided', 'cooked'].includes(d.status) ? 'ok' : ''}">${esc(label)}</span><div class="dish">${esc(w.name || (d.status === 'skip' ? 'Eating out' : 'Cook is off'))}</div>
      ${w.summary ? `<p class="meta">${esc(w.summary)}</p>` : ''}${r?.total_minutes ? `<p class="meta" style="margin-top:4px">About ${esc(r.total_minutes)} minutes for the cook</p>` : ''}`;
    if (r?.warning) h += `<p class="warn">${esc(r.warning)}</p>`;
    if (d.status === 'skip') h += `<p><button class="primary" onclick='sendToCook(this, ${esc(JSON.stringify(OFF_TEXT.skip))})'>Tell the cook</button></p>`;
    if (d.status === 'decided') h += `<p style="margin:16px 0 0"><button class="primary" onclick="this.disabled=true;act({action:'cooked'},'Marked as cooked. Pantry updated.')">${cook ? 'बन गया / Cooked' : 'Mark as cooked'}</button></p>`;
    h += '</section>';
    if (miss.length && d.status === 'decided') h += viewShopping(miss);
    if (r) {
      const en = `<details ${cook ? '' : 'open'}><summary>Recipe in English</summary><p>${esc(r.variants_en)}</p><ol>${(r.steps_en || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>`;
      const hi = `<details lang="hi" ${cook ? 'open' : ''}><summary>हिंदी में रेसिपी</summary><p>${esc(r.variants_hi)}</p><ol>${(r.steps_hi || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>`;
      const ing = `<details><summary>Ingredients</summary><ul class="todo">${(r.ingredients || []).map(i => `<li>${esc(i.item)} ${esc(i.qty)} ${esc(i.unit)}</li>`).join('')}</ul></details>`;
      const share = `<p class="row" style="margin-top:14px"><button class="primary" onclick='sendToCook(this, ${esc(JSON.stringify(cookText(w, r, 'hi')))})'>Send recipe to cook (Hindi)</button>
        <button onclick='sendToCook(this, ${esc(JSON.stringify(cookText(w, r, 'en')))})'>Send in English</button></p>`;
      h += (cook ? hi + en + ing : en + hi + ing) + (d.status === 'decided' ? share : '');
    }
  }
  h += viewTonight(d, cook);
  h += viewRate();
  const past = data.days.filter(x => x.date < data.today && x.winner).slice(-7).reverse();
  if (past.length) h += `<h2>Last few days</h2><div class="scroll"><table><tr><th>Date</th><th>Dish</th><th>Status</th></tr>${past.map(x => `<tr><td>${esc(x.date)}</td><td>${esc(J(x.winner, {}).name)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div>`;
  return h;
}

function viewTonight(d, cook) {
  if (d && !['voting', 'decided'].includes(d.status)) return '';
  const t = data.tonight, away = t.away.includes(me);
  let h = `<h2>Tonight</h2><p class="meta">${t.away.length ? esc(t.away.join(', ')) + ' not eating dinner. ' : 'Everyone is eating at home. '}${t.guests ? t.guests + ' guests. ' : ''}Changes before 1pm adjust the portions.</p>`;
  if (!cook) h += `<div class="row" style="margin-top:10px">
    <button onclick="this.disabled=true;act({action:'tonight',type:'${away ? 'home' : 'away'}'},'Saved')">${away ? 'I am eating tonight after all' : 'I am not eating tonight'}</button>
    <label style="max-width:150px">Guests for dinner<input id="guests" type="number" min="0" max="30" value="${t.guests}"></label>
    <button onclick="this.disabled=true;act({action:'tonight',type:'guests',count:$('#guests').value},'Guests saved')">Save guests</button></div>`;
  h += `<div class="row" style="margin-top:14px">
    <button onclick="if(confirm('Mark the cook as off today?')){this.disabled=true;act({action:'skipToday',reason:'cook_off'},'Day off noted')}">${cook ? 'आज छुट्टी / Day off today' : 'Cook is off today'}</button>
    ${cook ? '' : `<button onclick="if(confirm('No cooking today? The cook will be told.')){this.disabled=true;act({action:'skipToday',reason:'skip'},'No cooking today')}">No cooking today (eating out)</button>`}</div>`;
  return h;
}

function viewShopping(miss) {
  const b = data.buyer;
  const claim = !b ? `<button class="primary" onclick="this.disabled=true;act({action:'buying'},'Everyone has been told you are buying')">I am buying these</button>`
    : b === me ? `<span class="done">You are buying these.</span> <button onclick="this.disabled=true;act({action:'release'},'Handed back')">I cannot buy after all</button>`
    : `<span class="done">${esc(b)} is buying these.</span>`;
  return `<h2>To buy</h2><ul class="todo">${miss.map(m => `<li>${esc(m.item)} ${esc(m.qty)} ${esc(m.unit)}</li>`).join('')}</ul><p class="row">${claim}</p>`;
}

// Recipe text for the cook, sent by a family member over WhatsApp or any app.
function cookText(w, r, lang) {
  const hi = lang === 'hi', steps = (hi ? r.steps_hi : r.steps_en) || [];
  return [hi ? `*आज का खाना: ${w.name}*` : `*Today: ${w.name}*`, hi ? r.variants_hi : r.variants_en,
    r.warning ? '!! ' + r.warning : null, '', ...steps.map((x, i) => `${i + 1}. ${x}`), '',
    (hi ? 'सामग्री: ' : 'Ingredients: ') + (r.ingredients || []).map(i => `${i.item} ${i.qty} ${i.unit}`).join(', ')].filter(x => x != null).join('\n');
}
async function sendToCook(btn, text) {
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  await navigator.clipboard.writeText(text);
  btn.textContent = 'Copied. Paste it in WhatsApp';
}
const OFF_TEXT = { skip: 'आज खाना नहीं बनेगा, हम बाहर खा रहे हैं। No cooking today, we are eating out.' };

function viewRate() {
  const last = [...data.days].reverse().find(d => d.status === 'cooked');
  const yesterday = new Date(Date.parse(data.today) - 864e5).toISOString().slice(0, 10);
  if (!last || last.date < yesterday || !me || meRow()?.role === 'cook') return '';
  if (data.feedback.some(f => f.date === last.date && f.member === me)) return '';
  const dish = J(last.winner, {}).name;
  return `<h2>How was ${esc(dish)}?</h2><form onsubmit="event.preventDefault()"><fieldset class="choice">
    ${[1, 2, 3, 4, 5].map(n => `<button onclick="this.disabled=true;act({action:'rate',n:${n},comment:$('#rc').value},'Thanks, rating saved')">${n}</button>`).join('')}
    </fieldset><label style="margin-top:10px">Comment (optional)<input id="rc" placeholder="e.g. a bit too spicy"></label></form>`;
}

// ---------- Family ----------
function viewFamily() {
  const people = data.members.length ? data.members : [{ role: 'family' }];
  return `<p class="meta">Allergies are never broken. Everything else can be changed here at any time.</p>`
    + people.map((m, i) => `<form class="person" data-i="${i}" onsubmit="saveMember(event)"><div class="grid">${FIELDS.map(([f, l, x]) => `<label>${l}${Array.isArray(x)
      ? `<select name="${f}">${x.map(o => `<option ${o === (m[f] || '') ? 'selected' : ''} value="${o}">${o || 'choose'}</option>`).join('')}</select>`
      : `<input name="${f}" value="${esc(m[f])}" placeholder="${esc(x || '')}" ${f === 'name' ? 'required' : ''}>`}</label>`).join('')}</div>
      <button class="primary">Save ${esc(m.name || 'person')}</button>${m._row && m.role !== 'cook' ? viewPlan(m, i) : ''}</form>`).join('')
    + `<p style="margin-top:16px"><button onclick="data.members.push({role:'family'});render()">Add a person</button></p>`;
}
function viewPlan(m, i) {
  return `<div class="plan"><b>Diet plan</b>
    ${m.diet_plan ? `<p class="meta">Updated ${esc(m.diet_plan_updated)}. Suggestions and answers follow this.</p><p>${fmt(m.diet_plan)}</p>` : '<p class="meta">No diet plan yet. Upload one from a dietitian or app, or paste it.</p>'}
    <label style="margin-top:8px">Upload plan (PDF or photo)<input type="file" accept="application/pdf,image/*" onchange="planFile(this, ${i})"></label>
    <label style="margin-top:8px">Or paste it<textarea id="plan${i}" rows="4" placeholder="e.g. 1500 kcal, high protein, max 2 rotis at dinner, no fried food"></textarea></label>
    <p class="row" style="margin-top:8px"><button type="button" onclick="planText(this, ${i})">Save pasted plan</button>
    ${m.diet_plan ? `<button type="button" onclick="if(confirm('Remove this diet plan?'))act({action:'dietPlan',member:data.members[${i}].name,remove:true},'Plan removed')">Remove plan</button>` : ''}</p></div>`;
}
const readB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
async function photoB64(f) {
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82).split(',')[1];
}
async function planFile(input, i) {
  const f = input.files[0]; if (!f) return;
  if (f.type === 'application/pdf' && f.size > 4e6) return toast('That PDF is over 4 MB. Upload a smaller one or photos of the pages.', true);
  input.disabled = true; toast('Reading the diet plan...');
  const file = f.type === 'application/pdf' ? { mime: f.type, data: await readB64(f) } : { mime: 'image/jpeg', data: await photoB64(f) };
  act({ action: 'dietPlan', member: data.members[i].name, file }, 'Diet plan saved');
}
function planText(btn, i) {
  const text = $('#plan' + i).value.trim();
  if (!text) return toast('Paste the plan first.', true);
  busy(btn, 'Reading...'); act({ action: 'dietPlan', member: data.members[i].name, text }, 'Diet plan saved');
}
function saveMember(e) {
  e.preventDefault();
  const m = data.members[e.target.dataset.i] || {};
  act({ action: 'saveMember', row: { ...m, ...Object.fromEntries(new FormData(e.target)) } }, 'Saved');
}

// ---------- Pantry ----------
function viewPantry() {
  const rows = [...data.pantry].sort((a, b) => a.item.localeCompare(b.item));
  return `<p class="meta">Bill photos add items here. Marking a dish as cooked takes its ingredients out.</p>
    <form class="row person" onsubmit="addItem(event)">
      <label>Item<input name="item" required placeholder="e.g. toor dal"></label>
      <label>Quantity<input name="qty" required inputmode="decimal"></label>
      <label>Unit<select name="unit">${['kg', 'g', 'l', 'ml', 'pcs', 'pack'].map(u => `<option>${u}</option>`).join('')}</select></label>
      <label>Type<select name="category"><option value="fresh">fresh</option><option value="staple">staple</option></select></label>
      <button class="primary">Add item</button></form>
    <form class="person" onsubmit="addBulk(event)">
      <label>Add many at once, one item per line<textarea name="lines" rows="6" placeholder="toor dal 2 kg&#10;basmati rice 5 kg&#10;paneer 400 g&#10;eggs 12" style="width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-top:3px"></textarea></label>
      <div class="row" style="margin-top:10px"><label>Type<select name="category"><option value="staple">staple</option><option value="fresh">fresh</option></select></label>
      <button class="primary">Add all</button></div></form>
    ${rows.length ? `<div class="scroll"><table><tr><th>Item</th><th>Quantity</th><th>Unit</th><th>Type</th><th>Updated</th></tr>
      ${rows.map(p => `<tr><td>${esc(p.item)}</td><td><input aria-label="Quantity of ${esc(p.item)}" value="${esc(p.qty)}" inputmode="decimal" onchange="setQty(${p._row}, this.value)"></td><td>${esc(p.unit)}</td><td>${esc(p.category)}</td><td class="meta">${esc(p.updated_at)}</td></tr>`).join('')}
    </table></div>` : '<p class="meta">The pantry is empty. Add items above or add a bill photo in Spend.</p>'}`;
}
const UNITS = [[/^(kg|kgs|kilo)$/, 'kg'], [/^(g|gm|gms|grams?)$/, 'g'], [/^(l|ltr|litres?|liters?)$/, 'l'], [/^(ml)$/, 'ml'], [/^(packs?|packets?|pkts?)$/, 'pack'], [/^(pcs?|pieces?|nos?)$/, 'pcs']];
function parseLines(text, category) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*([a-z]+)?$/i);
    if (!m) return { item: l, qty: 1, unit: 'pack', category };
    const u = (m[3] || 'pcs').toLowerCase();
    return { item: m[1], qty: +m[2], unit: (UNITS.find(([re]) => re.test(u)) || [, u])[1], category };
  });
}
async function addBulk(e) {
  e.preventDefault();
  const f = new FormData(e.target), items = parseLines(f.get('lines'), f.get('category'));
  const r = await act({ action: 'pantryBulk', items });
  if (r) toast(`Added ${r.added} new, updated ${r.updated}`);
}
function addItem(e) { e.preventDefault(); act({ action: 'savePantry', row: Object.fromEntries(new FormData(e.target)) }, 'Item added'); }
function setQty(row, qty) { act({ action: 'savePantry', row: { ...data.pantry.find(p => p._row === row), qty } }, 'Quantity saved'); }

// ---------- Spend ----------
function viewSpend() {
  const { spent, limit } = data.budget;
  const pct = Math.min(100, spent / limit * 100);
  const list = data.purchases.slice(-30).reverse();
  return `<h2>This week</h2><p class="dish" style="font-size:40px">AED ${spent} <span class="meta" style="font-size:20px;font-weight:400">of ${limit}</span></p>
    <div class="meter" role="img" aria-label="${Math.round(pct)}% of weekly budget"><i class="${spent > limit ? 'over' : ''}" style="width:${pct}%"></i></div>
    <p class="meta">Fresh items from the last 7 days, plus staples averaged over ${esc(data.settings.STAPLES_SPREAD_WEEKS || 4)} weeks.</p>
    <h2>Add a bill</h2><p class="meta">Take a straight photo of the whole bill. Items go into the pantry and the amount into the budget.</p>
    <label class="row"><input type="file" accept="image/*" capture="environment" onchange="billPhoto(this)" ${me ? '' : 'disabled'}></label>
    <p class="meta" id="billState"></p>
    <h2>Spent without a bill</h2><form class="row person" onsubmit="addSpend(event)">
      <label>Amount (AED)<input name="total" type="number" min="1" step="0.5" required></label>
      <label>Type<select name="category"><option value="fresh">fresh</option><option value="staple">staple</option></select></label>
      <label>Note<input name="note" placeholder="e.g. baqala vegetables"></label>
      <button class="primary">Add amount</button></form>
    <h2>Bills</h2>${list.length ? `<div class="scroll"><table><tr><th>Date</th><th>Store</th><th>Total</th><th>Staples</th><th>Fresh</th></tr>
      ${list.map(p => `<tr><td>${esc(p.date)}</td><td>${esc(p.store)}</td><td>${esc(p.total)}</td><td>${esc(p.staples)}</td><td>${esc(p.fresh)}</td></tr>`).join('')}</table></div>`
      : '<p class="meta">No bills yet.</p>'}`;
}
function addSpend(e) { e.preventDefault(); act({ action: 'spend', ...Object.fromEntries(new FormData(e.target)) }, 'Amount added'); }
async function billPhoto(input) {
  const f = input.files[0]; if (!f) return;
  input.disabled = true; $('#billState').textContent = 'Reading the bill...';
  const r = await act({ action: 'bill', image: { mime: 'image/jpeg', data: await photoB64(f) } });
  if (r) toast(`Added ${r.count} items from ${r.store || 'the bill'} (AED ${r.total})`);
}

// ---------- Setup ----------
function viewSetup() {
  if (data.needsInit) return `<h2>Connect the Google Sheet</h2><p class="err">${esc(data.error)}</p>
    <p>Share the sheet with the service account email, add the environment variables in Netlify, then create the tabs.</p>
    <button class="primary" onclick="busy(this,'Creating...');act({action:'init'},'Sheet tabs created')">Create sheet tabs</button>`;
  const live = data.settings.LIVE === 'TRUE', miss = data.readiness;
  return `<h2>Go-live checklist</h2>
    ${miss.length ? `<ul class="todo">${miss.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '<p class="done">Everything is ready.</p>'}
    <p class="row">${live ? `<span class="done">Live. The vote opens daily at 12:00.</span><button onclick="act({action:'pause'},'Paused')">Pause</button>`
      : `<button class="primary" ${miss.length ? 'disabled' : ''} onclick="act({action:'goLive'},'Rasoi is live')">Go live</button>`}</p>
    <h2>Try it first</h2><p class="meta">See today's three options without notifying anyone.</p>
    <p class="row"><button onclick="runPreview(this)">Preview today's options</button>
      ${me ? `<button onclick="act({action:'testPush'},'Test sent')">Send me a test notification</button>` : ''}
      <button onclick="act({action:'init'},'Sheet tabs checked')">Repair sheet tabs</button></p>
    ${preview ? `<div>${preview.map((o, i) => `<div class="opt"><b>${i + 1}. ${esc(o.name)}</b><span>AED ${esc(o.est_cost_aed)}</span><span class="meta">${esc(o.summary)} About ${esc(o.cook_minutes)} min, ${esc(o.missing_items)} to buy.</span></div>`).join('')}</div>` : ''}
    <h2>Settings</h2><form class="person" onsubmit="saveSettings(event)"><div class="grid">
      ${Object.entries(data.settings).filter(([k]) => k !== 'LIVE').map(([k, v]) => `<label>${esc(k.replaceAll('_', ' ').toLowerCase())}<input name="${esc(k)}" value="${esc(v)}"></label>`).join('')}
    </div><button class="primary">Save settings</button></form>`;
}
async function runPreview(b) { busy(b, 'Thinking...'); const r = await act({ action: 'preview' }); if (r) { preview = r.options; render(); } }
function saveSettings(e) { e.preventDefault(); act({ action: 'saveSettings', settings: Object.fromEntries(new FormData(e.target)) }, 'Settings saved'); }

refresh();
</script>
