<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rasoi</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Rasoi: clean white cards, pastel icon tiles with line icons, 15px text. Details stay folded until tapped. */
:root{
  --canvas:#F4F4F6; --card:#FFFFFF; --card2:#F7F7F9; --ink:#111114; --ink2:#3A3A40; --muted:#8A8A93; --hair:#ECECF0;
  --accent:#FF8A00; --accent-ink:#B85F00; --green:#22A447; --red:#E5383B; --blue:#0A7CFF;
  --btn:#111114; --btn-ink:#FFFFFF; --shadow:0 1px 2px rgba(17,17,20,.04),0 6px 24px rgba(17,17,20,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --canvas:#000; --card:#151518; --card2:#1D1D21; --ink:#F4F4F6; --ink2:#D0D0D6; --muted:#8E8E96; --hair:#26262B;
  --accent:#FF9F1A; --accent-ink:#FFB347; --green:#34C759; --red:#FF453A; --blue:#2E8BFF;
  --btn:#F4F4F6; --btn-ink:#111114; --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{overscroll-behavior-y:contain}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Kohinoor Devanagari","Noto Sans Devanagari","Segoe UI",Roboto,sans-serif;
  letter-spacing:-.006em;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto;padding:10px 16px 0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{display:block}

/* top bar and titles */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.thali{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px var(--card)}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--card);border:0;box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}
.hero{margin:14px 0 12px}
.hero p{margin:0;color:var(--muted);font-size:13px;font-weight:500}
.hero h1{margin:1px 0 0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.022em}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:22px 4px 8px}

/* cards and grouped rows */
.card,.plate,.group,.banner,.person,.opt,.msg.bot{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.group{overflow:hidden}
.item{border-bottom:1px solid var(--hair)}
.item:last-child{border-bottom:0}
.item>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;min-height:56px}
.item>summary::-webkit-details-marker{display:none}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s ease;flex:none}
.item[open]>summary .chev{transform:rotate(90deg)}
.ib{padding:0 14px 16px}
.tile{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--t);
  background:color-mix(in srgb,var(--t) 14%,transparent)}
.tile svg{width:19px;height:19px}
.tile.av{color:#fff;background:var(--t);font-size:13px;font-weight:700;border-radius:50%}
.count{font-size:13px;font-weight:600;color:var(--muted);flex:none}
.count.hot{color:var(--red)}

/* the dish card */
.plate{padding:18px;position:relative;overflow:hidden}
.plate .photo{margin:-18px -18px 14px;height:170px;background:var(--card2) center/cover}
.plate-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dish{font-size:clamp(24px,7vw,30px);font-weight:700;line-height:1.12;letter-spacing:-.025em;margin:8px 0 6px}
.meta{color:var(--muted);margin:0;font-size:13px}
.pill-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink)}
.pill-tag svg{width:13px;height:13px}
.pill-tag.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.ring{width:40px;height:40px;flex:none;position:relative}
.ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.voters{display:flex;margin-top:10px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--card);margin-right:-6px}
.av.wait{background:var(--hair)!important;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* options inside the Options row */
.opt{box-shadow:none;background:var(--card2);border-radius:14px;padding:12px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.opt b{font-size:15px;font-weight:600}
.opt>span:nth-child(2){font-size:13px;font-weight:600;color:var(--accent-ink);white-space:nowrap}
.bar{grid-column:1/-1;height:4px;background:var(--hair);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.choice{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;grid-column:1/-1}
.choice button[aria-pressed=true]{background:var(--accent);color:#111;border-color:transparent}

/* buttons */
button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:8px 15px;cursor:pointer;border:1px solid var(--hair);
  background:var(--card);color:var(--ink);transition:transform .1s ease}
button:active{transform:scale(.97)}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
button.danger{color:var(--red)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.who{font-size:13px;padding:6px 12px;background:var(--card);border:0;box-shadow:var(--shadow)}
.ib .who,.opt .who,.msg .who{box-shadow:none;border:1px solid var(--hair)}
.filebtn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.filebtn input{display:none}
.filebtn svg{width:16px;height:16px}

/* forms */
label{display:block;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;width:100%;margin-top:3px;padding:9px 11px;border-radius:10px;border:1px solid var(--hair);background:var(--card2);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.person{padding:16px}
.pin input{font-size:26px;letter-spacing:.4em;text-align:center;max-width:200px}

/* lists */
.todo{list-style:none;padding:0;margin:4px 0}
.todo li{padding:7px 0;border-bottom:1px solid var(--hair)}
.todo li:last-child{border-bottom:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--hair);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td input{padding:6px 8px;margin:0}
details.sub{margin-top:8px;border-radius:12px;background:var(--card2);padding:10px 12px}
details.sub summary{cursor:pointer;font-weight:600;font-size:14px}
details.sub ol{padding-left:18px;margin:8px 0 2px}
details.sub li{margin:4px 0}

/* status */
.banner{padding:12px 14px;margin:0 0 12px;font-size:14px}
.done{color:var(--green);font-weight:600}
.err{color:var(--red)}
.soon{color:var(--red);font-weight:600}
.warn{background:var(--red);color:#fff;border-radius:12px;padding:10px 12px;margin:10px 0 0;font-weight:600;font-size:14px}
.meter{height:8px;background:var(--hair);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}
.big{font-size:30px;font-weight:700;letter-spacing:-.025em}

/* chat */
.msg{border-radius:18px;padding:9px 13px;margin:6px 0;max-width:86%;overflow-wrap:anywhere;font-size:15px}
.msg.me{background:var(--accent);color:#111;margin-left:auto;width:fit-content;border-bottom-right-radius:6px}
.msg.bot{border-bottom-left-radius:6px}
.yt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-weight:600;text-decoration:none;color:var(--red)!important}
.yt svg{width:18px;height:18px}

/* tab bar */
nav#nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;gap:2px;
  padding:5px;border-radius:999px;max-width:calc(100vw - 24px);background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid var(--hair)}
nav#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:6px 8px 5px;border:0;background:none;color:var(--muted);font-size:10px;font-weight:600}
nav#nav button svg{width:21px;height:21px}
nav#nav button[aria-current=page]{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* toast, pull to refresh, loading */
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:var(--card);
  box-shadow:0 8px 30px rgba(0,0,0,.15);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;max-width:92vw;text-align:center}
.toast.err{color:var(--red)}
.ptr{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;z-index:25;display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink2);opacity:0;pointer-events:none;transform:translate(-50%,-60px);background:var(--card);box-shadow:var(--shadow)}
.ptr i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hair);border-top-color:var(--accent)}
.ptr.spin i{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{border-radius:18px;background:linear-gradient(90deg,var(--hair) 25%,var(--card) 50%,var(--hair) 75%);background-size:300% 100%;animation:shim 1.3s infinite linear;margin-top:12px}
@keyframes shim{to{background-position:-150% 0}}
@media (prefers-reduced-motion:no-preference){
  .item[open]>.ib{animation:open .22s ease}
  @keyframes open{from{opacity:0;transform:translateY(-4px)}}
  .toast{animation:drop .3s ease}
  @keyframes drop{from{opacity:0;transform:translate(-50%,-10px)}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="thali" aria-hidden="true"></span>Rasoi</div>
    <div class="top-actions" id="top"></div>
  </div>
  <main id="main" aria-busy="true"><div class="skel" style="height:18px;width:40%;margin-top:28px"></div><div class="skel" style="height:38px;width:70%;margin-top:10px"></div><div class="skel" style="height:240px;border-radius:30px"></div><div class="skel" style="height:96px"></div><div class="skel" style="height:96px"></div></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<script>
const TABS = [['today', 'Today'], ['ask', 'Ask'], ['family', 'Family'], ['pantry', 'Pantry'], ['spend', 'Spend'], ['setup', 'Setup']];
const FIELDS = [
  ['name', 'Name'], ['role', 'Role', ['family', 'cook']],
  ['diet', 'Diet', ['', 'veg', 'non-veg', 'eggetarian', 'vegan', 'jain']], ['no_meat_days', 'No-meat days', 'e.g. Tuesday, Navratri'],
  ['allergies', 'Allergies', 'concrete items, e.g. peanut, prawn. Or "none"'], ['dislikes', 'Dislikes'], ['favourites', 'Favourite dishes'],
  ['spice', 'Spice level', ['', 'low', 'medium', 'high']], ['lunch', 'Next-day lunch', ['', 'home', 'tiffin', 'varies']], ['notes', 'Anything else', 'e.g. low oil'],
];
// Storage can throw in some private or standalone modes; never let that blank the page.
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};
let key = store.get('rasoi-key'), me = store.get('rasoi-me'), data = null, preview = null;
let chat = (() => { try { return JSON.parse(store.get('rasoi-chat')) || []; } catch { return []; } })();
const saveChat = () => store.set('rasoi-chat', JSON.stringify(chat.slice(-40)));
function showFatal(m) {
  const el = document.getElementById('main');
  if (el) el.insertAdjacentHTML('afterbegin', `<p class="err">Something went wrong: ${esc(m)} <button onclick="location.reload()">Reload</button></p>`);
}
addEventListener('error', e => showFatal(e.message));
addEventListener('unhandledrejection', e => showFatal(e.reason?.message || String(e.reason)));
let tab = location.hash.slice(1) || 'today';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = (s, d) => { if (!s) return d; try { return JSON.parse(s); } catch { return d; } };
const meRow = () => data.members?.find(m => m.name === me);
const isIOS = /iPhone|iPad/.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

navigator.serviceWorker?.register('/sw.js');
// After a new deploy the new service worker takes over; reload once so the new version shows.
const hadController = !!navigator.serviceWorker?.controller;
navigator.serviceWorker?.addEventListener('controllerchange', () => { if (hadController && !window.__reloading) { window.__reloading = true; location.reload(); } });

function toast(msg, bad) {
  const t = document.createElement('div');
  document.querySelectorAll('.toast').forEach(x => x.remove());
  t.className = 'toast' + (bad ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.append(t); setTimeout(() => t.remove(), 4000);
}

async function api(method, body) {
  if (!key) throw Object.assign(new Error(''), { login: true });
  const r = await fetch('/api/app', { method, headers: { 'x-app-key': key || '', 'x-admin-pin': store.get('rasoi-admin') || '', 'x-member-token': store.get('rasoi-token') || '', 'content-type': 'application/json' }, body: body && JSON.stringify({ ...body, me }) });
  const j = await r.json().catch(() => ({ error: r.status === 413 ? 'That file is too large. Try a smaller photo.'
    : [502, 504].includes(r.status) || r.status >= 500 ? 'That took too long for the free server. Try again, or use a closer, simpler photo.'
    : `The server sent an unreadable reply (${r.status}). Try again.` }));
  if (r.status === 401) { store.del('rasoi-key'); key = null; throw Object.assign(new Error('Wrong password, try again'), { login: true }); }
  if (j.pin) { store.del('rasoi-token'); pinFor = me; pinMode = 'enter'; }
  if (!r.ok) throw Object.assign(new Error(j.error || 'Request failed'), { missing: j.missing, pin: j.pin });
  return j;
}

let lastRefresh = 0, pinFor = null, pinMode = 'enter';
async function refresh() {
  lastRefresh = Date.now();
  try { data = await api('GET'); } catch (e) { data = { error: e.message, login: e.login }; }
  render();
}

async function act(body, done) {
  try { const r = await api('POST', body); await refresh(); if (done) toast(done); return r; }
  catch (e) { render(); toast(e.message + (e.missing ? ` (${e.missing.length} items left)` : ''), true); }
}

function busy(btn, text) { if (btn) { btn.disabled = true; btn.textContent = text; } }

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  today: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>'),
  ask: svg('<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l.9-4.1A8 8 0 1 1 20 12z"/>'),
  family: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14c2.3.2 4 1.7 4.5 4.5"/>'),
  pantry: svg('<rect x="5" y="7" width="14" height="13" rx="3"/><path d="M7 4h10v3H7z"/><path d="M9 12h6"/>'),
  spend: svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/>'),
  setup: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>').replace('<svg', '<svg style="width:13px;height:13px"'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>').replace('<svg', '<svg style="width:13px;height:13px"'),
  list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),
  cart: svg('<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>'),
  chef: svg('<path d="M7 14a4 4 0 0 1-.6-8A5 5 0 0 1 16 5a4 4 0 0 1 1 9"/><path d="M7 14h10v6H7z"/><path d="M10 17h4"/>'),
  users: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c1.8.6 3 2.2 3.3 4.5"/>'),
  star: svg('<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"/>'),
  heart: svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  sparkle: svg('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>'),
  calendar: svg('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  lock: svg('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>').replace('<svg', '<svg style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:4px"'),
  camera: svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  flame: svg('<path d="M12 21c-4 0-6.5-2.7-6.5-6.2 0-3.7 3-5.6 3.9-9.3 2.4 1.7 3 3.7 3.1 5.5 1-.6 1.6-1.6 1.9-2.8 2 1.6 4.1 4.1 4.1 6.6 0 3.5-2.5 6.2-6.5 6.2z"/>'),
  jar: svg('<rect x="6" y="8" width="12" height="13" rx="3"/><path d="M8 4h8v4H8z"/>'),
  leaf: svg('<path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19c3-4 6-6 9-7"/>'),
  wallet: svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/><path d="M3 9h18"/>'),
  receipt: svg('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),

async function ask(e) {

async function shareMsg(btn, i) {

const urlB64 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function enablePush(btn) {
  if (!('PushManager' in window)) return toast('This browser cannot receive notifications. Use Chrome on Android, or the home screen app on iPhone.', true);
  if (!data.vapidPublicKey) return toast('VAPID_PUBLIC_KEY is missing in Netlify settings.', true);
  busy(btn, 'Turning on...');
  if (await Notification.requestPermission() !== 'granted') { render(); return toast('Notifications are blocked. Allow them for Rasoi in the phone settings.', true); }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(data.vapidPublicKey) });
  if (await act({ action: 'subscribe', subscription: sub.toJSON() })) act({ action: 'testPush' }, 'Notifications are on. A test is on its way.');
}

function ring() {
  const left = Math.max(0, Date.parse(data.today + 'T09:00:00Z') - Date.now()), frac = Math.min(1, left / 36e5);
  const c = 2 * Math.PI * 19;
  return `<span class="ring" title="Time left to vote"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--hair)" stroke-width="4"/>
    <circle cx="23" cy="23" r="19" fill="none" stroke="var(--saffron)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg>
    <b>${Math.ceil(left / 6e4)}m</b></span>`;
}
async function loadPhotos() {

        url = Object.values((await res.json()).query?.pages || {})[0]?.thumbnail?.source || '';

}

const readB64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
async function photoB64(f) {
  const img = await createImageBitmap(f), k = Math.min(1, 1280 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75).split(',')[1];
}

const UNITS = [[/^(kg|kgs|kilo)$/, 'kg'], [/^(g|gm|gms|grams?)$/, 'g'], [/^(l|ltr|litres?|liters?)$/, 'l'], [/^(ml)$/, 'ml'], [/^(packs?|packets?|pkts?)$/, 'pack'], [/^(pcs?|pieces?|nos?)$/, 'pcs']];
function parseLines(text, category) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.+?)\s+(\d+(?:\.\d+)?)\s*([a-z]+)?$/i);
    if (!m) return { item: l, qty: 1, unit: 'pack', category };
    const u = (m[3] || 'pcs').toLowerCase();
    return { item: m[1], qty: +m[2], unit: (UNITS.find(([re]) => re.test(u)) || [, u])[1], category };
  });
}
async function addBulk(e) {
  e.preventDefault();
  const f = new FormData(e.target), items = parseLines(f.get('lines'), f.get('category'));
  const r = await act({ action: 'pantryBulk', items });
  if (r) toast(`Added ${r.added} new, updated ${r.updated}`);
}

        <span class="meta" style="grid-column:1/-1">${o.by ? `${o.from ? `Option ${o.from} changed` : 'Suggested'} by ${esc(o.by)}. ` : ''}${esc(o.summary)} About ${esc(o.cook_minutes)} min, AED ${esc(o.est_cost_aed)}.</span>

  } else {

        ${d.status === 'skip' ? `<button class="primary" onclick='sendToCook(this, ${esc(JSON.stringify('आज खाना नहीं बनेगा, हम बाहर खा रहे हैं। No cooking today, we are eating out.'))})'>Tell the cook</button>` : ''}
        ${data.isAdmin && ['off', 'skip'].includes(d.status) ? `<button onclick="busy(this,'Starting...');act({action:'startVote'},'Vote started')">Start a vote anyway</button>` : ''}
      </div></section>`;
    if (miss.length && d.status === 'decided') rows.push(row('buy', tile('cart', 'green'), 'To buy',
      `${miss.length} item${miss.length === 1 ? '' : 's'}, ${data.buyer ? `${esc(data.buyer === me ? 'you are' : data.buyer + ' is')} buying` : 'nobody is buying yet'}`, shoppingBody(miss), !data.buyer));

}

          <label>Staples (AED)<input name="staples" value="${esc(p.staples)}" inputmode="decimal"></label>
          <div class="actions" style="grid-column:1/-1;margin:0"><button class="primary">Save</button><button type="button" class="danger" onclick="delOwned('Purchases',${p._row},'this bill')">Delete</button></div></form>
        <p class="meta" style="margin-top:6px">Deleting a bill removes its amount. Pantry items stay; change them in Pantry.</p>` : ownerNote(p.added_by)}`)), bills.length ? 'Bills' : '');
}

// ---------- Setup (admin) ----------
function viewAdminLogin() {
  return `<p class="meta" style="margin:0 4px 10px">Setup, settings, Go live and Pause are for the admin${data.adminEmail ? ` (${esc(data.adminEmail)})` : ''}.</p>
    <form class="person row" onsubmit="adminLogin(event)"><label style="flex:1">Admin PIN<input name="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
    <button class="primary">${ICON.lock}Unlock</button></form>`;
}
function viewSetup() {
  if (!data.isAdmin) return viewAdminLogin();
  if (data.needsInit) return `<div class="banner err">${esc(data.error)}</div><div class="person"><p style="margin-top:0">Share the sheet with the service account email, add the environment variables in Netlify, then create the tabs.</p>
    <button class="primary" onclick="busy(this,'Creating...');act({action:'init'},'Sheet tabs created')">Create sheet tabs</button></div>`;
  const live = data.settings.LIVE === 'TRUE', miss = data.readiness;
  return `<section class="plate"><span class="pill-tag ${live ? 'ok' : ''}">${live ? ICON.check + 'Live' : ICON.clock + 'Not live'}</span>
      <div class="dish">${live ? 'Rasoi is running' : miss.length ? `${miss.length} thing${miss.length === 1 ? '' : 's'} left` : 'Ready to go live'}</div>
      <p class="meta">${live ? 'The vote opens daily at 12:00.' : 'Go live sends the daily vote to everyone.'}</p>
      <div class="actions">${live ? `<button onclick="act({action:'pause'},'Paused')">Pause</button>` : `<button class="primary" ${miss.length ? 'disabled' : ''} onclick="act({action:'goLive'},'Rasoi is live')">Go live</button>`}</div></section>`
    + group([
      row('check', tile('check', miss.length ? 'orange' : 'green'), 'Go-live checklist', miss.length ? `${miss.length} left` : 'All done',
        miss.length ? `<ul class="todo">${miss.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '<p class="done">Everything is ready.</p>', !!miss.length && !live),
      row('try', tile('sparkle', 'purple'), 'Try it', 'Preview options, test a notification',
        `<div class="actions" style="margin-top:0"><button onclick="runPreview(this)">Preview today's options</button>${me ? `<button onclick="act({action:'testPush'},'Test sent')">Test notification</button>` : ''}
          <button onclick="act({action:'init'},'Sheet tabs checked')">Repair sheet tabs</button></div>
        ${preview ? preview.map((o, i) => `<div class="opt"><b>${i + 1}. ${esc(o.name)}</b><span>AED ${esc(o.est_cost_aed)}</span><span class="meta">${esc(o.summary)} About ${esc(o.cook_minutes)} min.</span></div>`).join('') : ''}`, !!preview),
      row('settings', tile('gear', 'gray'), 'Settings', 'Budget, cook day, cooking time and more',
        `<form onsubmit="saveSettings(event)"><div class="grid">${Object.entries(data.settings).filter(([k]) => k !== 'LIVE').map(([k, v]) => `<label>${esc(k.replaceAll('_', ' ').toLowerCase())}<input name="${esc(k)}" value="${esc(v)}"></label>`).join('')}</div>
          <button class="primary">Save settings</button></form>`),
      row('lock', tile('lock', 'red'), 'Lock admin on this phone', 'You will need the PIN again', `<button onclick="adminLogout()">Lock admin</button>`),
    ]);
}

// ---------- staying fresh in the home-screen app (no browser reload there) ----------
const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
// Back to the app: refresh if it has been 20 s or more.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 20000 && !typing()) refresh(); });
// While a vote is open, keep the counts live.
setInterval(() => {
  const d = data?.days?.find(x => x.date === data.today);
  if (document.visibilityState === 'visible' && d?.status === 'voting' && !typing() && !document.querySelector('.ptr.spin')) refresh();
}, 30000);

// Pull down from the top to refresh.
const ptr = document.createElement('div'); ptr.className = 'ptr'; ptr.innerHTML = '<i></i><span>Pull to refresh</span>'; document.body.append(ptr);
let startY = null, pull = 0;
addEventListener('touchstart', e => { startY = scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; pull = 0; }, { passive: true });
addEventListener('touchmove', e => {
  if (startY == null) return;
  pull = Math.max(0, Math.min(140, (e.touches[0].clientY - startY) * 0.55));
  ptr.style.opacity = Math.min(1, pull / 60);
  ptr.style.transform = `translate(-50%, ${pull - 60}px)`;
  ptr.querySelector('span').textContent = pull > 70 ? 'Release to refresh' : 'Pull to refresh';
}, { passive: true });
addEventListener('touchend', async () => {
  if (startY == null) return;
  startY = null;
  if (pull > 70) {
    ptr.classList.add('spin'); ptr.querySelector('span').textContent = 'Refreshing';
    ptr.style.transform = 'translate(-50%, 10px)';
    await refresh();
    navigator.vibrate?.(10);
  }
  ptr.classList.remove('spin'); ptr.style.opacity = 0; ptr.style.transform = 'translate(-50%, -60px)'; pull = 0;
});

// Swipe left or right on the page to move between tabs.
const SWIPE_TABS = TABS.map(([k]) => k).filter(k => k !== 'setup');
let sx = null, sy = 0;
addEventListener('touchstart', e => {
  sx = e.touches.length === 1 && !e.target.closest('.scroll, input, textarea, select, nav') ? e.touches[0].clientX : null; sy = e.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', e => {
  if (sx == null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  const i = SWIPE_TABS.indexOf(tab);
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || i < 0 || !data || data.login || pinFor) return;
  const next = SWIPE_TABS[i + (dx < 0 ? 1 : -1)];
  if (next) { tab = next; location.hash = tab; render(); scrollTo(0, 0); }
}, { passive: true });

refresh();
</script>
</body>
</html>
